name: Supabase Age-Encrypted Backup with Safety Net

on:
  repository_dispatch:
    types: [supabase_backup_trigger]
  workflow_dispatch:
    inputs:
      force:
        description: "Create another backup even if today already has one"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      BACKUP_STORAGE_BRANCH: backups-latest-30

      # Canonical public recipient. Keep this as a GitHub Repository Variable,
      # never as a private identity or decryption key.
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}

      DISPATCH_AGE_RECIPIENT_SHA256: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.age_recipient_sha256 || '' }}
      DISPATCH_SOURCE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source || '' }}
      DISPATCH_POLICY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.backup_policy || '' }}
      FORCE_BACKUP: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.force || inputs.force || false }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install PostgreSQL 17 Client and age
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            age \
            ca-certificates \
            curl \
            gnupg \
            postgresql-common

          sudo install -d /usr/share/postgresql-common/pgdg

          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail \
            --silent \
            --show-error \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc

          . /etc/os-release

          sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null <<EOF_PGDG
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: ${VERSION_CODENAME}-pgdg
          Architectures: $(dpkg --print-architecture)
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF_PGDG

          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
          age --version

      - name: Calculate Madrid Date
        id: vars
        run: |
          set -euo pipefail

          echo "CURRENT_DAY=$(TZ=Europe/Madrid date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "TIMESTAMP=$(TZ=Europe/Madrid date +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_OUTPUT"

      - name: Validate Trigger and Configuration
        id: validate
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            if [ "$DISPATCH_SOURCE" != "supabase-edge-function" ]; then
              echo "::error::Origen de repository_dispatch no reconocido."
              exit 1
            fi

            if [ "$DISPATCH_POLICY" != "daily_full_age_encrypted_retain_last_30_verified" ]; then
              echo "::error::Política de backup no reconocida."
              exit 1
            fi

            if [ -z "${DISPATCH_AGE_RECIPIENT_SHA256:-}" ]; then
              echo "::error::Falta la huella pública age enviada por el disparador."
              exit 1
            fi
          fi

          if [ -z "${DB_URL:-}" ]; then
            echo "::error::Falta el secret SUPABASE_DB_URL."
            exit 1
          fi

          case "$DB_URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error::SUPABASE_DB_URL no parece una URL PostgreSQL válida."
              exit 1
              ;;
          esac

          if [ -z "${BACKUP_AGE_RECIPIENT:-}" ]; then
            echo "::error::Falta la Repository Variable BACKUP_AGE_RECIPIENT."
            exit 1
          fi

          printf 'recipient-validation' \
            | age \
                --encrypt \
                --recipient "$BACKUP_AGE_RECIPIENT" \
                --output /tmp/recipient-validation.age

          test -s /tmp/recipient-validation.age
          rm -f /tmp/recipient-validation.age

          AGE_RECIPIENT_SHA256="$(
            printf '%s' "$BACKUP_AGE_RECIPIENT" \
              | sha256sum \
              | awk '{print $1}'
          )"

          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ] \
            && [ "$AGE_RECIPIENT_SHA256" != "$DISPATCH_AGE_RECIPIENT_SHA256" ]; then
            echo "::error::La clave pública age de GitHub no coincide con la configurada en la Edge Function."
            exit 1
          fi

          echo "::add-mask::$DB_URL"
          echo "AGE_RECIPIENT_SHA256=$AGE_RECIPIENT_SHA256" >> "$GITHUB_OUTPUT"
          echo "Configuración validada."

      - name: Setup Global Backup Storage Branch
        run: |
          set -euo pipefail

          git config --local user.email \
            "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git fetch origin --prune

          if git ls-remote \
            --exit-code \
            --heads \
            origin \
            "$BACKUP_STORAGE_BRANCH" >/dev/null 2>&1; then
            git checkout \
              -B "$BACKUP_STORAGE_BRANCH" \
              "origin/$BACKUP_STORAGE_BRANCH"
          else
            git checkout -b "$BACKUP_STORAGE_BRANCH"
            git push -u origin "$BACKUP_STORAGE_BRANCH"
          fi

      - name: Detect Existing Daily Backup
        id: duplicate
        run: |
          set -euo pipefail

          mkdir -p encrypted_backups manifests

          FORCE="${FORCE_BACKUP,,}"
          if [ "$FORCE" = "true" ] || [ "$FORCE" = "1" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Ejecución forzada: se permite otro backup para hoy."
            exit 0
          fi

          if find manifests \
            -maxdepth 1 \
            -type f \
            -name 'database_backup_${{ steps.vars.outputs.CURRENT_DAY }}_*.json' \
            -print -quit \
            | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Ya existe un backup para ${{ steps.vars.outputs.CURRENT_DAY }}."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute Asymmetrically Encrypted Backup
        id: backup
        if: steps.duplicate.outputs.skip != 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT_SHA256: ${{ steps.validate.outputs.AGE_RECIPIENT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077

          mkdir -p encrypted_backups manifests

          TIMESTAMP="${{ steps.vars.outputs.TIMESTAMP }}"
          RAW_DUMP="database_backup_${TIMESTAMP}.dump"
          ENCRYPTED_DUMP_TMP="database_backup_${TIMESTAMP}.dump.age"
          BACKUP_PREFIX="encrypted_backups/database_backup_${TIMESTAMP}.dump.age"
          SHA_FILE="encrypted_backups/database_backup_${TIMESTAMP}.dump.age.sha256"
          MANIFEST_FILE="manifests/database_backup_${TIMESTAMP}.json"

          cleanup() {
            rm -f "$RAW_DUMP" "$ENCRYPTED_DUMP_TMP"
          }
          trap cleanup EXIT

          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" \
            --format=custom \
            --blobs \
            --no-owner \
            --no-privileges \
            --file "$RAW_DUMP"

          test -s "$RAW_DUMP"

          age \
            --encrypt \
            --recipient "$BACKUP_AGE_RECIPIENT" \
            --output "$ENCRYPTED_DUMP_TMP" \
            "$RAW_DUMP"

          test -s "$ENCRYPTED_DUMP_TMP"

          OVERALL_SHA256="$(
            sha256sum "$ENCRYPTED_DUMP_TMP" |
              awk '{print $1}'
          )"

          printf '%s  %s\n' \
            "$OVERALL_SHA256" \
            "$(basename "$ENCRYPTED_DUMP_TMP")" \
            > "$SHA_FILE"

          split \
            --bytes=90M \
            --suffix-length=3 \
            --additional-suffix=.part \
            "$ENCRYPTED_DUMP_TMP" \
            "${BACKUP_PREFIX}."

          export \
            TIMESTAMP \
            ENCRYPTED_DUMP_TMP \
            BACKUP_PREFIX \
            SHA_FILE \
            MANIFEST_FILE \
            OVERALL_SHA256 \
            AGE_RECIPIENT_SHA256

          python3 - <<'PY'
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path

          prefix = os.environ["BACKUP_PREFIX"]
          parts = sorted(glob.glob(f"{prefix}.*.part"))
          if not parts:
              raise SystemExit("No se generaron partes del backup cifrado")

          part_entries = []
          for filename in parts:
              path = Path(filename)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              part_entries.append({
                  "name": path.as_posix(),
                  "size_bytes": path.stat().st_size,
                  "sha256": digest,
              })

          manifest = {
              "schema_version": 3,
              "backup_type":
                  "full_logical_pg_dump_custom_age_encrypted_split",
              "timestamp_madrid": os.environ["TIMESTAMP"],
              "encrypted_original_filename":
                  os.environ["ENCRYPTED_DUMP_TMP"],
              "parts_prefix": prefix,
              "part_size": "90MiB",
              "part_count": len(part_entries),
              "parts": part_entries,
              "encrypted_sha256": os.environ["OVERALL_SHA256"],
              "sha256_file": os.environ["SHA_FILE"],
              "format": "pg_dump custom",
              "encryption": {
                  "format": "age",
                  "recipient_sha256":
                      os.environ["AGE_RECIPIENT_SHA256"],
                  "private_key_location": "offline-not-in-github",
              },
              "restore_order": (
                  f"cat {prefix}.*.part > "
                  f"{os.environ['ENCRYPTED_DUMP_TMP']}"
              ),
          }

          manifest_path = Path(os.environ["MANIFEST_FILE"])
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          REASSEMBLED_SHA256="$(
            cat "${BACKUP_PREFIX}."*.part |
              sha256sum |
              awk '{print $1}'
          )"

          if [ "$REASSEMBLED_SHA256" != "$OVERALL_SHA256" ]; then
            echo "::error::La verificación de reensamblado no coincide."
            exit 1
          fi

          rm -f "$RAW_DUMP" "$ENCRYPTED_DUMP_TMP"
          trap - EXIT

          echo "Backup cifrado y troceado correctamente."
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST_FILE" >> "$GITHUB_OUTPUT"

      - name: Validate All Backups and Retain Latest 30
        if: >-
          success() &&
          steps.duplicate.outputs.skip != 'true' &&
          steps.backup.outputs.created == 'true'
        env:
          NEW_MANIFEST: ${{ steps.backup.outputs.manifest }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          KEEP = 30
          MAX_PART_SIZE = 90 * 1024 * 1024

          repo = Path.cwd().resolve()
          manifests_root = (repo / "manifests").resolve()
          encrypted_root = (repo / "encrypted_backups").resolve()
          new_manifest = Path(os.environ["NEW_MANIFEST"])

          def confined(relative_name: str, root: Path) -> Path:
              relative = Path(relative_name)
              if relative.is_absolute() or ".." in relative.parts:
                  raise ValueError(f"Ruta insegura: {relative_name}")

              absolute = (repo / relative).resolve()
              if absolute != root and root not in absolute.parents:
                  raise ValueError(
                      f"Ruta fuera del directorio permitido: {relative_name}"
                  )
              if absolute.is_symlink():
                  raise ValueError(f"No se admiten enlaces simbólicos: {relative_name}")
              return absolute

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def validate_manifest(manifest_path: Path) -> dict:
              if not manifest_path.is_file() or manifest_path.is_symlink():
                  raise ValueError(f"Manifest inválido: {manifest_path}")

              document = json.loads(
                  manifest_path.read_text(encoding="utf-8")
              )

              if document.get("schema_version") != 3:
                  raise ValueError(
                      f"Schema no admitido en {manifest_path.name}"
                  )

              parts = document.get("parts")
              if not isinstance(parts, list) or not parts:
                  raise ValueError(
                      f"Sin partes válidas en {manifest_path.name}"
                  )

              if document.get("part_count") != len(parts):
                  raise ValueError(
                      f"part_count no coincide en {manifest_path.name}"
                  )

              seen = set()
              overall = hashlib.sha256()

              for entry in parts:
                  if not isinstance(entry, dict):
                      raise ValueError(
                          f"Entrada de parte inválida en {manifest_path.name}"
                      )

                  name = entry.get("name")
                  expected_size = entry.get("size_bytes")
                  expected_hash = entry.get("sha256")

                  if not isinstance(name, str):
                      raise ValueError(
                          f"Nombre de parte inválido en {manifest_path.name}"
                      )
                  if name in seen:
                      raise ValueError(
                          f"Parte duplicada en {manifest_path.name}: {name}"
                      )
                  seen.add(name)

                  part_path = confined(name, encrypted_root)
                  if not part_path.is_file():
                      raise ValueError(f"Falta la parte: {name}")

                  actual_size = part_path.stat().st_size
                  if actual_size <= 0 or actual_size > MAX_PART_SIZE:
                      raise ValueError(
                          f"Tamaño fuera de límites en {name}: {actual_size}"
                      )
                  if actual_size != int(expected_size):
                      raise ValueError(f"Tamaño incorrecto en {name}")

                  actual_hash = sha256_file(part_path)
                  if actual_hash != expected_hash:
                      raise ValueError(f"SHA-256 incorrecto en {name}")

                  with part_path.open("rb") as handle:
                      for chunk in iter(
                          lambda: handle.read(1024 * 1024),
                          b"",
                      ):
                          overall.update(chunk)

              overall_hash = overall.hexdigest()
              if overall_hash != document.get("encrypted_sha256"):
                  raise ValueError(
                      f"Hash global incorrecto en {manifest_path.name}"
                  )

              sha_name = document.get("sha256_file")
              if not isinstance(sha_name, str):
                  raise ValueError(
                      f"sha256_file inválido en {manifest_path.name}"
                  )

              sha_path = confined(sha_name, encrypted_root)
              if not sha_path.is_file():
                  raise ValueError(
                      f"Falta el fichero SHA-256: {sha_name}"
                  )

              recorded = sha_path.read_text(
                  encoding="utf-8"
              ).split()[0]
              if recorded != overall_hash:
                  raise ValueError(
                      f"Fichero SHA-256 incorrecto en {manifest_path.name}"
                  )

              return {
                  "manifest": manifest_path,
                  "parts": [entry["name"] for entry in parts],
                  "sha_file": sha_name,
              }

          manifest_paths = sorted(
              manifests_root.glob("database_backup_*.json")
          )
          if not manifest_paths:
              raise SystemExit("No existen manifests de backup")

          validated = []
          errors = []

          for manifest_path in manifest_paths:
              try:
                  validated.append(validate_manifest(manifest_path))
              except Exception as exc:
                  errors.append(f"{manifest_path.name}: {exc}")

          if errors:
              print("Se detectaron backups incompletos o inconsistentes:")
              for error in errors:
                  print(f" - {error}")
              raise SystemExit(
                  "Retención abortada: no se elimina nada mientras exista "
                  "algún backup inconsistente"
              )

          new_absolute = confined(
              new_manifest.as_posix(),
              manifests_root,
          )
          if new_absolute not in {
              item["manifest"].resolve() for item in validated
          }:
              raise SystemExit(
                  "El backup recién creado no figura entre los backups validados"
              )

          print(f"Backups completamente verificados: {len(validated)}")

          if len(validated) <= KEEP:
              print(
                  f"Hay {len(validated)} backups válidos. "
                  "No se elimina nada."
              )
              raise SystemExit(0)

          delete = validated[:-KEEP]
          if len(validated) - len(delete) < KEEP:
              raise SystemExit(
                  "Protección activa: la limpieza dejaría menos de 30 backups"
              )

          if new_absolute in {
              item["manifest"].resolve() for item in delete
          }:
              raise SystemExit(
                  "Protección activa: se intentó seleccionar el backup nuevo"
              )

          for item in delete:
              manifest_path = item["manifest"]
              print(f"Retirando backup verificado antiguo: {manifest_path.name}")

              for part_name in item["parts"]:
                  confined(part_name, encrypted_root).unlink()

              confined(item["sha_file"], encrypted_root).unlink()
              manifest_path.unlink()

          remaining = list(
              manifests_root.glob("database_backup_*.json")
          )
          if len(remaining) != KEEP:
              raise SystemExit(
                  f"Resultado de retención inesperado: quedan {len(remaining)}"
              )

          print("Retención completada: quedan exactamente 30 backups válidos.")
          PY

      - name: Commit Encrypted Backup Snapshot
        if: steps.duplicate.outputs.skip != 'true'
        run: |
          set -euo pipefail

          git add -A encrypted_backups manifests

          if git diff --cached --quiet; then
            echo "No encrypted backup changes detected."
            exit 0
          fi

          git commit -m \
            "backup: retain latest 30 verified age-encrypted dumps ${{ steps.vars.outputs.CURRENT_DAY }} [skip ci]"

          git push origin "$BACKUP_STORAGE_BRANCH"
