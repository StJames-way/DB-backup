name: Trusted Supabase age backup via backup-signer

on:
  workflow_call:
    inputs:
      event_name:
        required: true
        type: string
      force:
        required: false
        type: boolean
        default: false
      dispatch_source:
        required: true
        type: string
      dispatch_policy:
        required: true
        type: string
      dispatch_format_version:
        required: true
        type: number
      dispatch_age_recipient_sha256:
        required: false
        type: string
        default: ""
      backup_age_recipient:
        required: true
        type: string
      backup_signer_url:
        required: true
        type: string
    secrets:
      SUPABASE_DB_URL:
        required: true

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  backup-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      BACKUP_STORAGE_BRANCH: backups-signed-latest-30
      OPENBAO_OIDC_AUDIENCE: openbao://supabase-backup-signing
      BACKUP_SIGNER_URL: ${{ inputs.backup_signer_url }}
      EXPECTED_AGE_RECIPIENT_SHA256: f59fd599322f109270cfa7fd614e38b8eb7d5ca823c0443f8f0d55651e4b31aa
      BACKUP_SIGNING_PUBLIC_KEY_SHA256: 4011dd69e227bfcf6f39b3f44b1ad499d2a582c9f3eed93d8896e61b7485ce96
      # Fail-closed migration marker. Run tools/backup/configure_gateway_url.py
      # after Cloudflare deploy; it replaces this with the SHA-256 of the
      # normalized Worker URL without storing the URL itself in the workflow.
      EXPECTED_BACKUP_GATEWAY_URL_SHA256: b8863d62b3e1202b604de3b499b9e4e99751259c68e4a706b72c0a98e6c35553

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Checkout immutable reusable assets
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .trusted-workflow
          sparse-checkout: |
            tools/backup
            config/backup-signing-public-key.pem

      - name: Prepare immutable trusted tools
        run: |
          set -euo pipefail
          install -d -m 0700 /tmp/backup-trusted
          install -m 0500 .trusted-workflow/tools/backup/build_manifest.py /tmp/backup-trusted/
          install -m 0500 .trusted-workflow/tools/backup/verify_backup_set.py /tmp/backup-trusted/
          install -m 0500 .trusted-workflow/tools/backup/verify_signature.py /tmp/backup-trusted/
          install -m 0400 .trusted-workflow/config/backup-signing-public-key.pem /tmp/backup-trusted/
          openssl pkey -pubin -in /tmp/backup-trusted/backup-signing-public-key.pem -noout
          ACTUAL_KEY_SHA256="$(
            openssl pkey \
              -pubin \
              -in /tmp/backup-trusted/backup-signing-public-key.pem \
              -outform DER \
            | sha256sum \
            | awk '{print $1}'
          )"
          [ "$ACTUAL_KEY_SHA256" = "$BACKUP_SIGNING_PUBLIC_KEY_SHA256" ] || {
            echo "::error::La clave pública no coincide con la huella aprobada."
            exit 1
          }
          rm -rf .trusted-workflow

      - name: Install runner dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            age \
            ca-certificates \
            curl \
            python3-cryptography

          # Ubuntu 24.04 incluye PostgreSQL 16. El servidor Supabase usa
          # PostgreSQL 17, así que instalamos explícitamente el cliente 17
          # desde el repositorio oficial PGDG.
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl \
            --fail \
            --silent \
            --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc

          . /etc/os-release
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.postgresql.org/pub/repos/apt' \
            "Suites: ${VERSION_CODENAME}-pgdg" \
            'Components: main' \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            postgresql-client-17

          PG17_BIN="/usr/lib/postgresql/17/bin"
          test -x "$PG17_BIN/pg_dump" || {
            echo "::error::No se instaló pg_dump 17."
            exit 1
          }
          test -x "$PG17_BIN/pg_restore" || {
            echo "::error::No se instaló pg_restore 17."
            exit 1
          }
          test -x "$PG17_BIN/psql" || {
            echo "::error::No se instaló psql 17."
            exit 1
          }

          # GITHUB_PATH se aplica a los pasos siguientes. El export permite
          # verificar la versión también dentro de este mismo paso.
          echo "$PG17_BIN" >> "$GITHUB_PATH"
          export PATH="$PG17_BIN:$PATH"

          for tool in age curl git jq openssl pg_dump pg_restore psql python3 sha256sum split; do
            command -v "$tool" >/dev/null || {
              echo "::error::Falta $tool"
              exit 1
            }
          done

          python3 -c 'import cryptography'

          pg_dump --version
          pg_restore --version
          psql --version
          age --version

          pg_dump --version | grep -Eq '^pg_dump \(PostgreSQL\) 17\.' || {
            echo "::error::La versión activa de pg_dump no es PostgreSQL 17."
            exit 1
          }
          pg_restore --version | grep -Eq '^pg_restore \(PostgreSQL\) 17\.' || {
            echo "::error::La versión activa de pg_restore no es PostgreSQL 17."
            exit 1
          }

      - name: Validate trigger and configuration
        id: validate
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_AGE_RECIPIENT: ${{ inputs.backup_age_recipient }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "::error::El caller debe ejecutarse desde main."
            exit 1
          }
          [ -n "$DB_URL" ] || { echo "::error::Falta SUPABASE_DB_URL."; exit 1; }
          case "$DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::SUPABASE_DB_URL no parece PostgreSQL."; exit 1 ;;
          esac
          [ -n "$BACKUP_AGE_RECIPIENT" ] || {
            echo "::error::Falta BACKUP_AGE_RECIPIENT."
            exit 1
          }
          case "$BACKUP_SIGNER_URL" in
            https://*) ;;
            *) echo "::error::BACKUP_SIGNER_URL debe usar HTTPS."; exit 1 ;;
          esac
          [ "$EXPECTED_BACKUP_GATEWAY_URL_SHA256" != "$(printf '0%.0s' {1..64})" ] || {
            echo "::error::Configura la URL del gateway con tools/backup/configure_gateway_url.py."
            exit 1
          }
          ACTUAL_GATEWAY_URL_SHA256="$(
            printf '%s' "${BACKUP_SIGNER_URL%/}" | sha256sum | awk '{print $1}'
          )"
          [ "$ACTUAL_GATEWAY_URL_SHA256" = "$EXPECTED_BACKUP_GATEWAY_URL_SHA256" ] || {
            echo "::error::BACKUP_SIGNER_URL no coincide con el gateway Cloudflare aprobado."
            exit 1
          }
          printf 'recipient-test' | age -e -r "$BACKUP_AGE_RECIPIENT" -o /tmp/age-test.age
          rm -f /tmp/age-test.age
          AGE_SHA="$(printf '%s' "$BACKUP_AGE_RECIPIENT" | sha256sum | awk '{print $1}')"
          [ "$AGE_SHA" = "$EXPECTED_AGE_RECIPIENT_SHA256" ] || {
            echo "::error::El recipient age no coincide con la huella aprobada."
            exit 1
          }
          if [ "${{ inputs.event_name }}" = "repository_dispatch" ]; then
            [ "${{ inputs.dispatch_source }}" = "supabase-edge-function" ] || {
              echo "::error::Origen repository_dispatch no reconocido."
              exit 1
            }
            [ "${{ inputs.dispatch_policy }}" = "daily_full_age_encrypted_openbao_signed_retain_last_30_verified" ] || {
              echo "::error::Política de backup no reconocida."
              exit 1
            }
            [ "${{ inputs.dispatch_format_version }}" = "5" ] || {
              echo "::error::Versión de backup no reconocida."
              exit 1
            }
            [ "$AGE_SHA" = "${{ inputs.dispatch_age_recipient_sha256 }}" ] || {
              echo "::error::Supabase y GitHub no tienen el mismo recipient age."
              exit 1
            }
          fi
          echo "::add-mask::$DB_URL"
          echo "AGE_RECIPIENT_SHA256=$AGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Calculate dates
        id: vars
        run: |
          set -euo pipefail
          echo "CURRENT_DAY=$(TZ=Europe/Madrid date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "TIMESTAMP=$(TZ=Europe/Madrid date +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_OUTPUT"

      - name: Open storage snapshot branch
        id: storage
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin --prune
          REMOTE_SHA="$(git ls-remote --heads origin "$BACKUP_STORAGE_BRANCH" | awk '{print $1}')"
          if [ -n "$REMOTE_SHA" ]; then
            git checkout -B "$BACKUP_STORAGE_BRANCH" "origin/$BACKUP_STORAGE_BRANCH"
          else
            git checkout --orphan "$BACKUP_STORAGE_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
            mkdir -p encrypted_backups manifests signatures
          fi
          echo "REMOTE_SHA=$REMOTE_SHA" >> "$GITHUB_OUTPUT"

      - name: Detect existing daily backup
        id: duplicate
        run: |
          set -euo pipefail
          mkdir -p encrypted_backups manifests signatures
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif find manifests -maxdepth 1 -type f \
              -name 'database_backup_${{ steps.vars.outputs.CURRENT_DAY }}_*.json' \
              -print -quit | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Ya existe un backup firmado para hoy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create, encrypt, sign and verify backup
        id: backup
        if: steps.duplicate.outputs.skip != 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_AGE_RECIPIENT: ${{ inputs.backup_age_recipient }}
          AGE_RECIPIENT_SHA256: ${{ steps.validate.outputs.AGE_RECIPIENT_SHA256 }}
          TIMESTAMP: ${{ steps.vars.outputs.TIMESTAMP }}
          EXPECTED_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          EXPECTED_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          umask 077

          BASE="database_backup_${TIMESTAMP}"
          RAW_DUMP="${BASE}.dump"
          ENCRYPTED_TMP="${BASE}.dump.age"
          PREFIX="encrypted_backups/${BASE}.dump.age"
          MANIFEST="manifests/${BASE}.json"
          SIGNATURE="signatures/${BASE}.sig"
          SIGNATURE_META="signatures/${BASE}.json"
          OIDC_JSON="$(mktemp)"
          CLAIMS_JSON="$(mktemp)"
          REQUEST_JSON="$(mktemp)"
          RESPONSE_JSON="$(mktemp)"
          COMPLETE=false

          cleanup() {
            rm -f "$RAW_DUMP" "$ENCRYPTED_TMP" "$OIDC_JSON" "$CLAIMS_JSON" "$REQUEST_JSON" "$RESPONSE_JSON"
            unset OIDC_TOKEN || true
            if [ "$COMPLETE" != "true" ]; then
              rm -f "$MANIFEST" "$SIGNATURE" "$SIGNATURE_META" "${PREFIX}."*.part
            fi
          }
          trap cleanup EXIT INT TERM

          CLIENT_MAJOR="$(
            pg_dump --version |
            sed -E 's/^pg_dump \(PostgreSQL\) ([0-9]+).*/\1/'
          )"
          SERVER_VERSION_NUM="$(
            psql "$DB_URL" \
              --no-psqlrc \
              --no-align \
              --tuples-only \
              --command 'SHOW server_version_num' |
            tr -d '[:space:]'
          )"

          [[ "$CLIENT_MAJOR" =~ ^[0-9]+$ ]] || {
            echo "::error::No se pudo determinar la versión mayor de pg_dump."
            exit 1
          }
          [[ "$SERVER_VERSION_NUM" =~ ^[0-9]+$ ]] || {
            echo "::error::No se pudo determinar server_version_num."
            exit 1
          }

          SERVER_MAJOR="$((SERVER_VERSION_NUM / 10000))"

          printf 'PostgreSQL server major: %s\n' "$SERVER_MAJOR"
          printf 'pg_dump client major:   %s\n' "$CLIENT_MAJOR"

          if [ "$CLIENT_MAJOR" -lt "$SERVER_MAJOR" ]; then
            echo "::error::pg_dump $CLIENT_MAJOR no puede exportar PostgreSQL $SERVER_MAJOR."
            exit 1
          fi

          pg_dump "$DB_URL" \
            --format=custom \
            --blobs \
            --no-owner \
            --no-privileges \
            --file "$RAW_DUMP"
          test -s "$RAW_DUMP"
          PLAINTEXT_SHA256="$(sha256sum "$RAW_DUMP" | awk '{print $1}')"

          age -e -r "$BACKUP_AGE_RECIPIENT" -o "$ENCRYPTED_TMP" "$RAW_DUMP"
          test -s "$ENCRYPTED_TMP"
          ENCRYPTED_SHA256="$(sha256sum "$ENCRYPTED_TMP" | awk '{print $1}')"

          split --bytes=90M --suffix-length=3 --additional-suffix=.part \
            "$ENCRYPTED_TMP" "${PREFIX}."
          compgen -G "${PREFIX}.*.part" >/dev/null

          AUDIENCE_ENCODED="$(jq -rn --arg value "$OPENBAO_OIDC_AUDIENCE" '$value|@uri')"
          curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE_ENCODED}" \
            > "$OIDC_JSON"
          OIDC_TOKEN="$(jq -er '.value' "$OIDC_JSON")"

          OIDC_TOKEN="$OIDC_TOKEN" python3 - "$CLAIMS_JSON" <<'PY'
          import base64
          import json
          import os
          import sys

          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          required = [
              "repository", "repository_id", "repository_owner_id", "workflow_ref",
              "workflow_sha", "job_workflow_ref", "job_workflow_sha", "ref", "sha",
              "run_id", "run_attempt", "event_name", "runner_environment",
          ]
          missing = [name for name in required if name not in claims]
          if missing:
              raise SystemExit(f"OIDC claims missing: {missing}")
          if claims["runner_environment"] != "github-hosted":
              raise SystemExit("OIDC token is not from a GitHub-hosted runner")
          if claims["repository"] != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("OIDC repository mismatch")
          if claims["ref"] != "refs/heads/main":
              raise SystemExit("OIDC ref mismatch")
          if claims["job_workflow_ref"] != os.environ["EXPECTED_JOB_WORKFLOW_REF"]:
              raise SystemExit("OIDC job_workflow_ref mismatch")
          if claims["job_workflow_sha"] != os.environ["EXPECTED_JOB_WORKFLOW_SHA"]:
              raise SystemExit("OIDC job_workflow_sha mismatch")
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump({name: str(claims[name]) for name in required}, handle, sort_keys=True)
          PY

          CREATED_AT_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          REPOSITORY="$(jq -er '.repository' "$CLAIMS_JSON")"
          WORKFLOW_REF="$(jq -er '.workflow_ref' "$CLAIMS_JSON")"
          SOURCE_SHA="$(jq -er '.sha' "$CLAIMS_JSON")"
          RUN_ID="$(jq -er '.run_id' "$CLAIMS_JSON")"
          RUN_ATTEMPT="$(jq -er '.run_attempt' "$CLAIMS_JSON")"

          python3 /tmp/backup-trusted/build_manifest.py \
            --parts-glob "${PREFIX}.*.part" \
            --plaintext-sha256 "$PLAINTEXT_SHA256" \
            --encrypted-sha256 "$ENCRYPTED_SHA256" \
            --age-recipient-sha256 "$AGE_RECIPIENT_SHA256" \
            --created-at-utc "$CREATED_AT_UTC" \
            --timestamp-madrid "$TIMESTAMP" \
            --repository "$REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$SOURCE_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --output "$MANIFEST"

          jq -n --slurpfile manifest "$MANIFEST" '{manifest:$manifest[0]}' > "$REQUEST_JSON"
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 90 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "@$REQUEST_JSON" \
            "${BACKUP_SIGNER_URL%/}/v1/sign" \
            > "$RESPONSE_JSON"
          unset OIDC_TOKEN

          OPENBAO_SIGNATURE="$(jq -er '.signature' "$RESPONSE_JSON")"
          KEY_VERSION="$(jq -er '.key_version' "$RESPONSE_JSON")"
          REMOTE_MANIFEST_SHA256="$(jq -er '.manifest_sha256' "$RESPONSE_JSON")"
          LOCAL_MANIFEST_SHA256="$(python3 - "$MANIFEST" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          canonical = json.dumps(
              value,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          print(hashlib.sha256(canonical).hexdigest())
          PY
          )"
          [ "$REMOTE_MANIFEST_SHA256" = "$LOCAL_MANIFEST_SHA256" ] || {
            echo "::error::El firmador firmó un manifiesto con digest distinto."
            exit 1
          }

          printf '%s\n' "$OPENBAO_SIGNATURE" > "$SIGNATURE"
          jq -n \
            --arg signature_file "$SIGNATURE" \
            --arg manifest_file "$MANIFEST" \
            --arg manifest_sha256 "$LOCAL_MANIFEST_SHA256" \
            --arg signed_at_utc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --argjson key_version "$KEY_VERSION" \
            '{
              schema_version:1,
              provider:"backup-signer-openbao-transit",
              algorithm:"ed25519",
              key_version:$key_version,
              manifest_file:$manifest_file,
              signature_file:$signature_file,
              manifest_sha256:$manifest_sha256,
              signed_at_utc:$signed_at_utc
            }' > "$SIGNATURE_META"

          python3 /tmp/backup-trusted/verify_backup_set.py --manifest "$MANIFEST"
          python3 /tmp/backup-trusted/verify_signature.py \
            --public-key /tmp/backup-trusted/backup-signing-public-key.pem \
            --manifest "$MANIFEST" \
            --signature "$SIGNATURE"

          rm -f "$RAW_DUMP" "$ENCRYPTED_TMP"
          COMPLETE=true
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Retain only the newest 30 verified backups
        if: steps.duplicate.outputs.skip != 'true' && steps.backup.outputs.created == 'true'
        run: |
          set -euo pipefail
          mapfile -t ALL_MANIFESTS < <(
            find manifests -maxdepth 1 -type f -name 'database_backup_*.json' -printf '%f\n' \
              | sort -r
          )
          if [ "${#ALL_MANIFESTS[@]}" -le 30 ]; then
            exit 0
          fi
          for NAME in "${ALL_MANIFESTS[@]:30}"; do
            MANIFEST="manifests/$NAME"
            PREFIX="$(jq -er '.parts_prefix' "$MANIFEST")"
            BASE="${NAME%.json}"
            rm -f "$MANIFEST" "signatures/${BASE}.sig" "signatures/${BASE}.json" "${PREFIX}."*.part
          done

      - name: Publish one-commit storage snapshot
        if: steps.duplicate.outputs.skip != 'true' && steps.backup.outputs.created == 'true'
        env:
          REMOTE_SHA: ${{ steps.storage.outputs.REMOTE_SHA }}
        run: |
          set -euo pipefail
          git add -A encrypted_backups manifests signatures
          TREE="$(git write-tree)"
          COMMIT="$(printf '%s\n' \
            'backup: signed snapshot ${{ steps.vars.outputs.CURRENT_DAY }} [skip ci]' \
            | git commit-tree "$TREE")"
          if [ -n "$REMOTE_SHA" ]; then
            git push \
              --force-with-lease="refs/heads/$BACKUP_STORAGE_BRANCH:$REMOTE_SHA" \
              origin "$COMMIT:refs/heads/$BACKUP_STORAGE_BRANCH"
          else
            git push origin "$COMMIT:refs/heads/$BACKUP_STORAGE_BRANCH"
          fi%
