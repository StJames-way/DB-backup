name: Supabase signed backup dispatch

on:
  repository_dispatch:
    types: [supabase_backup_trigger]
  workflow_dispatch:
    inputs:
      force:
        description: "Crear otro backup aunque ya exista uno hoy"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: supabase-signed-backup
  cancel-in-progress: false

jobs:
  signed-backup:
    # PASO OBLIGATORIO: sustituye el marcador por el SHA completo del commit
    # aprobado en StJames-way/backup-workflows. Nunca uses @main ni un tag móvil.
    uses: StJames-way/DB-backup/.github/workflows/supabase-age-openbao-reusable.yml@ae38bc3857a74a17a4a8fc8ca6009393356f3832  
    with:
      event_name: ${{ github.event_name }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force || github.event.client_payload.force || false }}
      dispatch_source: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source || 'manual' }}
      dispatch_policy: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.backup_policy || 'daily_full_age_encrypted_openbao_signed_retain_last_30_verified' }}
      dispatch_format_version: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.backup_format_version || 5 }}
      dispatch_age_recipient_sha256: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.age_recipient_sha256 || '' }}
      backup_age_recipient: ${{ vars.BACKUP_AGE_RECIPIENT }}
    secrets:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
