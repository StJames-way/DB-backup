name: Test old GPG backup password

on:
  workflow_dispatch:
    inputs:
      backup_ref:
        description: "Rama que contiene el backup"
        required: true
        default: "backups-2026-07"
      backup_base:
        description: "Nombre base sin .dump.gpg"
        required: true
        default: "database_backup_2026-07-26_00-00-59"

permissions:
  contents: read

jobs:
  test-decryption:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout backup branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.backup_ref }}

      - name: Install GPG and PostgreSQL 17 client
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            curl \
            gnupg \
            postgresql-common

          sudo install -d /usr/share/postgresql-common/pgdg

          sudo curl \
            --fail \
            --silent \
            --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc

          . /etc/os-release

          sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null <<EOF
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: ${VERSION_CODENAME}-pgdg
          Architectures: $(dpkg --print-architecture)
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF

          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          echo "Version GPG:"
          gpg --version | head -n 1

          echo "Version pg_restore:"
          /usr/lib/postgresql/17/bin/pg_restore --version
          
      - name: Reassemble, verify and test decryption
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
          BASE: ${{ inputs.backup_base }}
        run: |
          set -euo pipefail
          umask 077

          if [ -z "${BACKUP_ENCRYPTION_PASSWORD:-}" ]; then
            echo "::error::BACKUP_ENCRYPTION_PASSWORD no existe o está vacío."
            exit 1
          fi

          # Admite backups guardados en encrypted_backups/ o en la raíz.
          if [ -f "encrypted_backups/${BASE}.dump.gpg.aaa.part" ]; then
            BACKUP_DIR="encrypted_backups"
          elif [ -f "${BASE}.dump.gpg.aaa.part" ]; then
            BACKUP_DIR="."
          else
            echo "::error::No se encuentra la primera parte del backup."
            exit 1
          fi

          PART_PREFIX="${BACKUP_DIR}/${BASE}.dump.gpg"
          SHA_FILE="${PART_PREFIX}.sha256"
          ENCRYPTED="/tmp/${BASE}.dump.gpg"
          DECRYPTED="/tmp/${BASE}.dump"
          CONTENTS="/tmp/${BASE}.contents.txt"

          cleanup() {
            rm -f "$ENCRYPTED" "$DECRYPTED" "$CONTENTS"
          }

          trap cleanup EXIT

          PART_COUNT="$(
            find "$BACKUP_DIR" \
              -maxdepth 1 \
              -type f \
              -name "${BASE}.dump.gpg.*.part" |
            wc -l |
            tr -d ' '
          )"

          if [ "$PART_COUNT" -eq 0 ]; then
            echo "::error::No se encontraron partes del backup."
            exit 1
          fi

          echo "Partes encontradas: $PART_COUNT"

          cat "${PART_PREFIX}".*.part > "$ENCRYPTED"

          if [ ! -s "$ENCRYPTED" ]; then
            echo "::error::El archivo reconstruido está vacío."
            exit 1
          fi

          if [ ! -f "$SHA_FILE" ]; then
            echo "::error::No se encuentra el archivo SHA-256."
            exit 1
          fi

          EXPECTED_SHA256="$(awk 'NR == 1 { print $1 }' "$SHA_FILE")"
          ACTUAL_SHA256="$(sha256sum "$ENCRYPTED" | awk '{ print $1 }')"

          if [ "$EXPECTED_SHA256" != "$ACTUAL_SHA256" ]; then
            echo "::error::SHA-256 incorrecta."
            exit 1
          fi

          echo "SHA-256 correcta."

          if ! printf '%s\n' "$BACKUP_ENCRYPTION_PASSWORD" |
            gpg \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase-fd 0 \
              --output "$DECRYPTED" \
              --decrypt "$ENCRYPTED"
          then
            echo "::error::El secreto actual no descifra este backup."
            echo "::error::Fue rotado o no coincide con el usado al crearlo."
            exit 1
          fi

          if [ ! -s "$DECRYPTED" ]; then
            echo "::error::GPG no produjo un archivo válido."
            exit 1
          fi

          /usr/lib/postgresql/17/bin/pg_restore \
  --list "$DECRYPTED" \
  > "$CONTENTS"

          if [ ! -s "$CONTENTS" ]; then
            echo "::error::El dump descifrado no parece válido."
            exit 1
          fi

          echo "BACKUP DESCIFRADO Y VALIDADO CORRECTAMENTE."
          echo "El secreto de GitHub coincide con este backup."
